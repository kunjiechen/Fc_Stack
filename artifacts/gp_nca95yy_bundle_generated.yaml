  - id: "SRS-GPNCA95YY-IF-0002"
    category: "interface"
    statement: "`Gp_NCA95yy` 模块应提供 `Gp_NCA95yy_MainFunction(void)` 周期性驱动接口，执行 INT 引脚状态采样和中断响应处理。"
    source: "AURIX2G 规范-1.2 MainFunction 接口规则；芯片手册-6.2.3"
    status: "draft"
    evidence:
      - "artifacts/srs_Gp_NCA95yy.md"
      - "Gp_NCA95yy_MainFunction"
  - id: "SRS-GPNCA95YY-IF-0003"
    category: "interface"
    statement: "`Gp_NCA95yy` 模块应提供 `Gp_NCA95yy_GetGpInSig(uint16 Id_u16, uint8* State_pu8)` 接口，解析信号 Id 后通过 I2C 读取对应 Input Port 寄存器，应用极性反转后返回该引脚的逻辑状态。"
    source: "芯片手册-6.5.3 Input Port Registers；原始需求-GetGpInSig"
    status: "ready"
    evidence:
      - "artifacts/srs_Gp_NCA95yy.md"
      - "Gp_NCA95yy_GetGpInSig"
  - id: "SRS-GPNCA95YY-IF-0004"
    category: "interface"
    statement: "`Gp_NCA95yy` 模块应提供 `Gp_NCA95yy_SetGpOutSig(uint16 Id_u16, uint8 State_u8)` 接口，解析信号 Id 后通过读改写方式设置目标引脚的输出电平，保证同 port 其他 bit 不受影响。"
    source: "芯片手册-6.5.4 Output Port Registers；原始需求-SetGpOutSig"
    status: "draft"
    evidence:
      - "artifacts/srs_Gp_NCA95yy.md"
      - "Gp_NCA95yy_SetGpOutSig"
  - id: "SRS-GPNCA95YY-IF-0005"
    category: "interface"
    statement: "`Gp_NCA95yy` 模块应提供 `Gp_NCA95yy_GetDevFaultSig(uint16 Id_u16, uint32* Fault_pu32)` 接口，返回指定芯片实例的当前故障诊断信息，包括 I2C 通信错误、中断异常状态和初始化失败标志。"
    source: "AURIX2G 规范-8.8 IoExtDev 接口；芯片手册-6.2.3 INT；原始需求-GetDevFaultSig"
    status: "draft"
    evidence:
      - "artifacts/srs_Gp_NCA95yy.md"
      - "Gp_NCA95yy_GetDevFaultSig"
  - id: "SRS-GPNCA95YY-IF-0006"
    category: "interface"
    statement: "`Gp_NCA95yy` 模块的所有对外接口应实现 DET (Development Error Tracer) 错误检测：当接口被调用时传入非法参数（Id 越界、空指针、State 非法值等），应通过 DET 机制报告开发错误并返回 E_NOT_OK。"
    source: "原始需求-所有接口必须支持DET错误检测"
    status: "ready"
    evidence:
      - "artifacts/srs_Gp_NCA95yy.md"
