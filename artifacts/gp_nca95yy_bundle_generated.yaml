    statement: "`Gp_NCA95yy` 模块应提供 `Gp_NCA95yy_Init(void)` 接口，完成当前核所有已配置芯片实例的初始化。"
    source: "AURIX2G 规范-1.1 接口分类法则；原始需求-Init"
    status: "draft"
    evidence:
